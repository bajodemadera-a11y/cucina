:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#23332b;background:#f8f7f2}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.shell{max-width:960px;margin:auto;padding:20px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 25px}.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;background:#254d3e;color:white;width:46px;height:46px;border-radius:15px;font-size:23px}.brand h1{font-size:25px;letter-spacing:-.8px;margin:0}.subtitle{color:#758079;font-size:12px;margin-top:2px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d9dfd7;background:white;color:#284238;border-radius:12px;padding:10px 13px;font-weight:650}.btn.primary{background:#254d3e;color:#fff;border-color:#254d3e}.btn.minor{background:transparent}.btn.red{color:#a43a32;border-color:#e7ceca}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9bc5ae;outline-offset:2px}.intro{margin:0 0 22px}.intro h2{margin:0 0 7px;font-size:29px;letter-spacing:-1px}.intro p{margin:0;color:#718076;line-height:1.5}.categories{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:23px 0}.cat{border:1px solid #e1e4db;border-radius:19px;padding:18px;background:#fff;text-align:left;display:flex;align-items:center;gap:13px}.cat.active{border-color:#3c6f54;background:#edf4ec}.cat .emoji{font-size:27px;background:#f3f4ed;width:51px;height:51px;display:grid;place-items:center;border-radius:15px}.cat strong{display:block;font-size:17px}.cat small{color:#7b837d}.control{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 14px}.control h3{font-size:20px;margin:0}.search{width:250px;max-width:53%;background:white;border:1px solid #dbe2d9;padding:11px 13px;border-radius:12px}.recipes{display:grid;grid-tem isplay:grid;grid-template-columns:repeat(3,1fr);gap:9px}.nutrition div{background:#f4f6f1;border-radius:12px;padding:12px}.nutrition strong{display:block;font-size:19px}.nutrition small{font-size:11px;color:#758075}.muted{color:#839086;font-size:13px;line-height:1.5}.steps{white-space:pre-wrap;line-height:1.7;color:#4d6255}.overlay{position:fixed;inset:0;background:#1a281dcc;display:grid;place-items:center;padding:17px;z-index:10}.modal{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 15px 60px #0003}.modal h3{margin:0 0 6px;font-size:22px}.modal .sub{margin:0 0 20px;font-size:13px;color:#7b887e}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hidden{display:none!important}.hint{font-size:12px;color:#79857c}.number-info{border-radius:10px;background:#f7f8f3;padding:12px;font-size:12px;color:#687a6d;margin:12px 0}.file-input{display:none}.scaleform{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.scale-results .ingredient{grid-template-columns:minmax(0,1fr) auto}button:disabled{opacity:.45}.scale-results{padding:0 4px}@media print{.top-actions,.back,.detail-header>button,.section-actions,.scaleform,.textlink{display:none!important}.panel{break-inside:avoid}body{background:white}}@media(max-width:620px){.shell{padding:13px 14px 70px}.top{align-items:start}.top-actions .btn{padding:9px 10px;font-size:12px}.brand h1{font-size:22px}.intro h2{font-size:25px}.cat{padding:13px 10px;gap:9px}.cat .emoji{width:43px;height:43px;font-size:22px}.cat strong{font-size:15px}.recipes{grid-template-columns:1fr}.recipe{min-height:135px}.nutrition{grid-template-columns:repeat(2,1fr)}.detail-header h2{font-size:25px}.ingredient{gap:7px}.textlink{padding:8px;font-size:12px}.panel{padding:15px}.edit-grid{grid-template-columns:1fr}}
</style></head><body><main id="app" class="shell"></main><input class="file-input" id="importFile" type="file" accept="application/json,.json"><script>
'use strict';
const KEY='cucina_ricette_v1';
const nutrientKeys=[['kcal','kcal'],['protein','Proteine (g)'],['carbs','Carboidrati (g)'],['fat','Grassi (g)'],['sat','Saturi (g)'],['fiber','Fibre (g)']];
const createId=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));
const ing=(name,qty,unit='g',nutrition=null)=>({id:createId(),name,qty,unit,nutrition});
const base=[
{id:'paola3',category:'dolce',name:'Torta di Paola 3.0',status:'Ricetta trascritta',description:'Mela, banana, avena e cioccolato',cookedWeight:null,ingredients:[ing("Farina d’avena integrale",200),ing('Farina 00',80),ing('Milk Pro al cioccolato',200),ing('Yogurt greco Delta 0%',150),ing('Uova intere',3,'pz'),ing('Mela matura',250),ing('Banana matura',150),ing('Cacao amaro Selex',35),ing('Zucchero',45),ing('Burro',20),ing('Lievito vanigliato per dolci',16),ing('Rum',15),ing('Sale',null,'q.b.')],steps:'1. Schiacciare la banana e grattugiare la mela.\n2. Sbattere leggermente le uova.\n3. Aggiungere Milk Pro, yogurt, banana, mela, zucchero, rum e burro fuso tiepido.\n4. Mescolare a parte farine, cacao, lievito e sale.\n5. Incorporare gli ingredienti secchi.\n\nLa temperatura e il tempo di cottura non sono stati verificati in questa trascrizione.'},
{id:'banana',category:'dolce',name:'Banana bread',status:'Da verificare',description:'Versione grande preparata a ottobre 2026; mela variabile 250–300 g',cookedWeight:1530,ingredients:[ing('Banana',250),ing('Mela a pezzetti',null),ing("Farina d’avena",300),ing('Whey Bulk',60),ing('Yogurt greco',380),ing('Uova intere',4,'pz'),ing('Burro',40),ing('Cacao amaro',60),ing('Zucchero',55),ing('Lievito per dolci',20),ing('Cannella',null,'q.b.')],steps:'Preriscaldare il forno statico a 175 °C. Cottura indicativa 50–60 minuti; controllare con lo stecchino dopo 50 minuti.\n\nNota: la quantità finale di mela (250 o 300 g) non è confermata. Peso cotto registrato: 1530 g.'},
{id:'burger',category:'salato',name:'Hamburger di ceci e soia',status:'Ricetta recuperata',description:'Versione proteica; il peso finale registrato era 2050 g crudi',cookedWeight:null,rawWeight:2050,ingredients:[ing('Ceci cotti e scolati',1200),ing('Soia secca',300),ing('Uova',2,'pz'),ing('Albume',200),ing('Farina 0',40),ing('Amido di mais',20),ing('Olio',20),ing('Sale',12),ing('Farina 0 aggiunta',20)],steps:'Reidratare la soia, scolarla e strizzarla. Unire ai ceci schiacciati con uova, albume, farine, amido, olio e sale. Lasciare riposare 30 minuti in frigorifero, formare gli hamburger e congelare. Peso totale crudo registrato: 2.050 g. Sono inclusi 20 g di farina 0 aggiunti successivamente.'},
{id:'pane',category:'salato',name:'Pane integrale con semi',status:'Ricetta recuperata',description:'Preparato nello stampo 11 × 30 × 7 cm',cookedWeight:850,ingredients:[ing('Farina integrale',335),ing('Farina d’avena',165),ing('Mix di semi',30),ing('Semi di chia',20),ing('Lievito secco',7),ing('Sale',0),ing('Acqua',400)],steps:'Ingredienti recuperati dalla ricetta precedente. Acqua indicata come intervallo 400–430 g: qui è registrato il minimo 400 g, modificabile.\n\nStampo 11 × 30 × 7 cm. Peso finale cotto registrato: 850 g. Cottura in forno ventilato 200 °C per 15 minuti, poi 180 °C per 25–35 minuti. La preparazione effettiva era senza sale: 0 g.'}
];
function clone(v){return JSON.parse(JSON.stringify(v))}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(x)){
   for(const b of base){
    const r=x.find(v=>v.id===b.id);
    if(!r){x.push(clone(b));continue}
    // Migra soltanto le ricette preinstallate rimaste incomplete;
    // non cancellare note, preparazioni modificate o ingredienti personali.
    if(b.id==='pane' && Array.isArray(r.ingredients) && r.ingredients.length===0){
     r.ingredients=clone(b.ingredients);
     if((r.steps||'').includes('Lista ingredienti e dosi da recuperare'))r.steps=b.steps;
     r.status=b.status;
    }
    if(b.id==='burger' && Array.isArray(r.ingredients) && r.ingredients.length===3){
     const old=r.ingredients.find(v=>v.name==='Farina aggiunta in seguito');
     if(old && Number(old.qty)===20){old.name='Farina 0 aggiuntiva';}
    }
   }
   return x;
  }
 }catch(e){}
 return clone(base);
}
let recipes=load(), category='dolce', selected=null, query='', scaledTarget=null;
try{localStorage.setItem(KEY,JSON.stringify(recipes))}catch(e){}
function refreshBundledRecipes(){
 const ids=['pane','burger','banana','paola3'];
 if(!confirm('Aggiornare gli ingredienti delle 4 ricette iniziali? Le tue note e le ricette create da te resteranno salvate. Le dosi eventualmente modificate nelle 4 ricette saranno sostituite con quelle recuperate.'))return;
 for(const id of ids){
  const fresh=base.find(r=>r.id===id);
  const index=recipes.findIndex(r=>r.id===id);
  if(!fresh)continue;
  if(index<0){recipes.push(clone(fresh));continue;}
  const old=recipes[index];
  recipes[index]={...clone(fresh),notes:old.notes||'',cookedWeight:old.cookedWeight??fresh.cookedWeight,rawWeight:old.rawWeight??fresh.rawWeight};
 }
 save();scaledTarget=null;render();alert('Ricette iniziali aggiornate. Le note sono state mantenute.');
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(recipes));}catch(e){alert('Salvataggio sul dispositivo non riuscito: esporta un backup.')}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function fnum(n){return Number.isFinite(Number(n))?Number(n).toLocaleString('it-IT',{maximumFractionDigits:2}):'—'}
function qtxt(i){return i.qty===null||i.qty===''?'Da inserire':fnum(i.qty)+' '+esc(i.unit||'g')}
function getRecipe(){return recipes.find(r=>r.id===selected)}
function header(){return `<header class="top"><div class="brand"><div class="logo">♨</div><div><h1>Cucina</h1><div class="subtitle">Il mio ricettario</div></div></div><div class="top-actions"><button class="btn" data-act="refreshBase">↻ Aggiorna ricette</button><button class="btn" data-act="export">↓ Backup</button><button class="btn" data-act="import">↑ Importa</button></div></header>`}
function home(){const group=recipes.filter(r=>r.category===category&&r.name.toLowerCase().includes(query.toLowerCase()));return `${header()}<section class="intro"><h2>Le mie ricette</h2><p>Ingredienti e quantità modificabili. Le modifiche vengono salvate su questo dispositivo.</p></section><div class="categories"><button class="cat ${category==='dolce'?'active':''}" data-act="category" data-category="dolce"><span class="emoji">🍰</span><span><strong>Dolce</strong><small>${recipes.filter(r=>r.category==='dolce').length} ricette</small></span></button><button class="cat ${category==='salato'?'active':''}" data-act="category" data-category="salato"><span class="emoji">🥘</span><span><strong>Salato</strong><small>${recipes.filter(r=>r.category==='salato').length} ricette</small></span></button></div><div class="control"><h3>${category==='dolce'?'Dolci':'Salati'}</h3><input class="search" id="search" aria-label="Cerca ricette" placeholder="Cerca ricetta…" value="${esc(query)}"></div><section class="recipes">${group.map(r=>`<article class="recipe"><span class="chip">${esc(r.status||'Ricetta')}</span><h4>${esc(r.name)}</h4><p>${esc(r.description||'')}</p><div class="bottom"><span class="muted">${r.ingredients.length} ingredienti</span><button class="btn primary" data-act="open" data-id="${esc(r.id)}">Apri ricetta</button></div></article>`).join('')||'<div class="empty">Nessuna ricetta trovata.</div>'}</section><div class="section-actions"><button class="btn primary" data-act="new">+ Nuova ricetta</button></div>`}
function nutrition(r){if(!r.ingredients.length||r.ingredients.some(i=>i.qty===null||i.qty===''||i.unit!=='g'||!i.nutrition||nutrientKeys.some(([k])=>!Number.isFinite(Number(i.nutrition[k]))))){return `<p class="muted">Calcolo non disponibile: per ottenere valori affidabili servono le quantità in grammi e i sei valori nutrizionali per 100 g di <strong>ogni</strong> ingrediente. Puoi inserirli premendo Modifica. Le uova a pezzi vanno convertite in grammi edibili.</p>`}
const totals=Object.fromEntries(nutrientKeys.map(([k])=>[k,r.ingredients.reduce((s,i)=>s+Number(i.qty)*Number(i.nutrition[k])/100,0)]));const per100=r.cookedWeight>0?Object.fromEntries(nutrientKeys.map(([k])=>[k,totals[k]*100/Number(r.cookedWeight)])):null;
const block=(vals,title)=>`<h4>${title}</h4><div class="nutrition">${nutrientKeys.map(([k,label])=>`<div><strong>${fnum(vals[k])}</strong><small>${label}</small></div>`).join('')}</div>`;
return block(totals,'Totale ricetta')+(per100?block(per100,'Per 100 g dopo la cottura'):'<p class="muted">Inserisci il peso finale per visualizzare i valori per 100 g.</p>')}
function scalingPanel(r){
 const w=Number(r.cookedWeight);
 if(!(w>0))return `<p class="muted">Per adattare le dosi, registra prima il peso finale cotto della ricetta originale.</p>`;
 const active=Number.isFinite(scaledTarget)&&scaledTarget>0;
 return `<p class="note">Inserisci quanto prodotto cotto vuoi ottenere. Premendo Calcola si aggiornano direttamente le quantità nell’elenco Ingredienti sopra. La ricetta originale resta salvata.</p>
 <form id="scaleForm" class="scaleform"><label class="field" style="margin:0;flex:1">Peso cotto desiderato (g)<input name="target" type="number" min="1" step="any" required value="${active?esc(scaledTarget):''}" placeholder="Es. 2000"></label><button class="btn primary" type="submit">Calcola</button></form>
 ${active?`<div class="number-info"><strong>Dosi visualizzate sopra:</strong> per ${fnum(scaledTarget)} g cotti (originale ${fnum(w)} g; × ${fnum(scaledTarget/w)}). Nessuna modifica alla ricetta salvata.</div><button class="btn" data-act="resetScale">Ripristina originale</button>`:''}
 <p class="note">La resa è una stima proporzionale e può variare in cottura. Per ingredienti senza quantità registrata rimane «Da inserire».</p>`;
}
function detail(){const r=getRecipe();if(!r){selected=null;return home()}const scaled=Number.isFinite(scaledTarget)&&scaledTarget>0&&Number(r.cookedWeight)>0;const mult=scaled?scaledTarget/Number(r.cookedWeight):1;return `${header()}<button class="back" data-act="back">← Tutte le ricette</button><div class="detail-header"><div><span class="chip">${r.category==='dolce'?'Dolce':'Salato'} · ${esc(r.status||'Ricetta')}</span><h2>${esc(r.name)}</h2><p>${esc(r.description||'')}</p></div><button class="btn" data-act="meta">Modifica ricetta</button></div><section class="panel" id="ingredientsPanel"><h3>Ingredienti ${scaled?'<span class="chip">Dosi adattate</span>':''}</h3>${scaled?`<div class="number-info">Quantità necessarie per ottenere circa <strong>${fnum(scaledTarget)} g cotti</strong>. Originale salvato: ${fnum(r.cookedWeight)} g. <button class="btn" data-act="resetScale" style="margin-left:8px">Ripristina originale</button></div>`:''}${r.ingredients.map(i=>`<div class="ingredient"><div><strong>${esc(i.name)}</strong>${!i.nutrition?'<small>Valori nutrizionali non inseriti</small>':''}</div><span class="amount">${scaled&&i.qty!==null&&i.qty!==''&&i.unit!=='q.b.'?fnum(Number(i.qty)*mult)+' '+esc(i.unit||'g'):qtxt(i)}</span><button class="textlink" data-act="editIng" data-iid="${esc(i.id)}" ${scaled?'disabled title="Ripristina l’originale per modificare la ricetta"':''}>Modifica</button></div>`).join('')||'<p class="muted">Nessun ingrediente ancora inserito.</p>'}<div class="section-actions"><button class="btn" data-act="addIng" ${scaled?'disabled':''}>+ Ingrediente</button></div></section><section class="panel"><h3>Preparazione</h3><div class="steps">${esc(r.steps||'Preparazione non inserita.')}</div><div class="section-actions"><button class="btn" data-act="steps">Modifica preparazione</button></div></section><section class="panel"><h3>Pesi finali originali</h3><p><strong>Peso dopo cottura:</strong> ${r.cookedWeight>0?fnum(r.cookedWeight)+' g':'non inserito'}</p>${r.rawWeight>0?`<p><strong>Peso crudo:</strong> ${fnum(r.rawWeight)} g</p>`:''}<button class="btn" data-act="weight" ${scaled?'disabled':''}>Modifica pesi</button></section><section class="panel"><h3>Valori nutrizionali della ricetta originale</h3>${nutrition(r)}<p class="note">Si calcolano quando tutti i dati verificati degli ingredienti sono presenti. I valori sopra si riferiscono alla ricetta originale.</p></section><section class="panel"><h3>Le mie note</h3><div class="steps">${r.notes?esc(r.notes):'<span class="muted">Nessuna nota ancora inserita.</span>'}</div><div class="section-actions"><button class="btn" data-act="notes">${r.notes?'Modifica note':'+ Aggiungi nota'}</button></div><p class="note">Le note rimangono associate alla ricetta originale anche quando adatti le quantità.</p></section><section class="panel" id="adaptPanel"><h3>Adatta quantità</h3>${scalingPanel(r)}</section><div class="section-actions"><button class="btn red" data-act="deleteRecipe">Elimina ricetta</button></div>`}
function render(){document.getElementById('app').innerHTML=selected?detail():home()}
function modal(title,subtitle,body,onSave){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="sub">${esc(subtitle||'')}</p><form id="editForm">${body}<div class="modal-footer"><button class="btn" type="button" id="cancel">Annulla</button><button class="btn primary" type="submit">Salva</button></div></form></div>`;document.body.appendChild(o);o.querySelector('#cancel').onclick=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o)o.remove()});o.querySelector('form').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.currentTarget).entries());if(onSave(obj)!==false){save();o.remove();render()}};return o}
const field=(name,label,value='',type='text',extra='')=>`<label class="field">${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value??'')}" ${extra}></label>`;
const num=(v)=>v===''?null:Number(String(v).replace(',','.'));
function editIngredient(i){const isNew=!i;const ref=i||ing('',null);const nutr=ref.nutrition||{};const body=`${field('name','Ingrediente',ref.name,'text','required') }<div class="edit-grid">${field('qty','Quantità',ref.qty,'number','min="0" step="any"')}${`<label class="field">Unità<select name="unit">${['g','ml','pz','q.b.'].map(u=>`<option ${ref.unit===u?'selected':''}>${u}</option>`).join('')}</select></label>`}</div><details><summary style="cursor:pointer;font-weight:700;padding:12px 0">Valori nutrizionali per 100 g (facoltativi)</summary><p class="note">Inserisci solo i valori verificati dall’etichetta o da una fonte attendibile. Per il calcolo automatico servono tutti e sei.</p><div class="edit-grid">${nutrientKeys.map(([k,label])=>field('n_'+k,label,nutr[k]??'','number','min="0" step="any"')).join('')}</div></details>${!isNew?'<button class="btn red" type="button" id="removeIng">Rimuovi ingrediente</button>':''}`;
const m=modal(isNew?'Nuovo ingrediente':'Modifica ingrediente','Le quantità aggiornate vengono salvate.',body,o=>{if(!o.name.trim())return false;if(o.qty!==''&&(!Number.isFinite(num(o.qty))||num(o.qty)<0))return false;const n=Object.fromEntries(nutrientKeys.map(([k])=>[k,num(o['n_'+k])]));const hasAny=nutrientKeys.some(([k])=>o['n_'+k]!==''),all=nutrientKeys.every(([k])=>o['n_'+k]!==''&&Number.isFinite(n[k])&&n[k]>=0);if(hasAny&&!all){alert('Per evitare calcoli incompleti, compila tutti e sei i valori nutrizionali oppure lasciali tutti vuoti.');return false}Object.assign(ref,{name:o.name.trim(),qty:num(o.qty),unit:o.unit,nutrition:all?n:null});if(isNew)getRecipe().ingredients.push(ref)});
if(!isNew)m.querySelector('#removeIng').onclick=()=>{if(confirm(`Rimuovere ${ref.name}?`)){getRecipe().ingredients=getRecipe().ingredients.filter(x=>x.id!==ref.id);save();m.remove();render()}};
}
function editMeta(isNew){const r=isNew?{name:'',category:category,description:'',status:'Da completare'}:getRecipe();const b=`${field('name','Nome ricetta',r.name,'text','required')}<label class="field">Categoria<select name="category"><option value="dolce" ${r.category==='dolce'?'selected':''}>Dolce</option><option value="salato" ${r.category==='salato'?'selected':''}>Salato</option></select></label>${field('description','Descrizione',r.description)}<label class="field">Stato<select name="status">${['Ricetta trascritta','Da verificare','Da completare','Ricetta confermata'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></label>`;modal(isNew?'Nuova ricetta':'Modifica ricetta','',b,o=>{if(!o.name.trim())return false;if(isNew){r.id=createId();r.ingredients=[];r.steps='';r.cookedWeight=null;recipes.push(r);selected=r.id}else{category=o.category}Object.assign(r,{name:o.name.trim(),category:o.category,description:o.description,status:o.status})})}
function editSteps(){modal('Modifica preparazione','Scrivi i passaggi della ricetta.',`<label class="field">Preparazione<textarea name="steps" rows="10">${esc(getRecipe().steps||'')}</textarea></label>`,o=>{getRecipe().steps=o.steps})}
function editNotes(){const r=getRecipe();modal('Note della ricetta','Annotazioni, consigli e modifiche per la prossima volta.',`<label class="field">Le mie note<textarea name="notes" rows="7" placeholder="Es. La prossima volta aggiungere 10 g di cacao...">${esc(r.notes||'')}</textarea></label>`,o=>{r.notes=o.notes})}
function editWeight(){const r=getRecipe();modal('Pesi della ricetta','Il peso dopo cottura serve per i valori nutrizionali per 100 g.',`<div class="edit-grid">${field('cookedWeight','Peso dopo cottura (g)',r.cookedWeight,'number','min="0" step="any"')}${field('rawWeight','Peso crudo totale (g)',r.rawWeight,'number','min="0" step="any"')}</div>`,o=>{if(['cookedWeight','rawWeight'].some(k=>o[k]!==''&&(!Number.isFinite(num(o[k]))||num(o[k])<0)))return false;r.cookedWeight=num(o.cookedWeight);r.rawWeight=num(o.rawWeight)})}
function backup(){const b=new Blob([JSON.stringify({app:'Cucina',version:1,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='cucina-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function validImport(x){return x&&x.app==='Cucina'&&Array.isArray(x.recipes)&&x.recipes.length<2000&&x.recipes.every(r=>typeof r.id==='string'&&typeof r.name==='string'&&['dolce','salato'].includes(r.category)&&Array.isArray(r.ingredients)&&r.ingredients.length<200)}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!validImport(x)){alert('File backup non valido.');return}if(confirm('Importare il backup? Le ricette attuali su questo dispositivo saranno sostituite.')){recipes=x.recipes;selected=null;category='dolce';save();render()}}catch(err){alert('Impossibile leggere il file JSON.')}finally{e.target.value=''}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='refreshBase'){refreshBundledRecipes()}else if(a==='category'){category=b.dataset.category;query='';render()}else if(a==='open'){selected=b.dataset.id;scaledTarget=null;render()}else if(a==='back'){selected=null;scaledTarget=null;render()}else if(a==='editIng'){editIngredient(getRecipe().ingredients.find(i=>i.id===b.dataset.iid))}else if(a==='addIng'){editIngredient(null)}else if(a==='new'){editMeta(true)}else if(a==='meta'){editMeta(false)}else if(a==='steps'){editSteps()}else if(a==='notes'){editNotes()}else if(a==='weight'){editWeight()}else if(a==='resetScale'){scaledTarget=null;render()}else if(a==='printScale'){window.print()}else if(a==='deleteRecipe'){if(confirm('Eliminare definitivamente questa ricetta?')){recipes=recipes.filter(r=>r.id!==selected);selected=null;save();render()}}else if(a==='export'){backup()}else if(a==='import'){document.getElementById('importFile').click()}});
document.addEventListener('submit',e=>{if(e.target.id!=='scaleForm')return;e.preventDefault();const v=Number(new FormData(e.target).get('target'));if(!Number.isFinite(v)||v<=0){alert('Inserisci un peso cotto maggiore di zero.');return}scaledTarget=v;render();document.getElementById('ingredientsPanel')?.scrollIntoView({behavior:'smooth',block:'start'})});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const x=document.getElementById('search');x.focus();x.setSelectionRange(pos,pos)}});
render();if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
</script></body></html>
